services:
  postgres:
    image: postgres:17-alpine
    container_name: interactive-comments-section-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: interactive_comments_section
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d interactive_comments_section']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
